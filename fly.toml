app = "teai-api"
primary_region = "nrt"

[build]
  builder = "heroku/buildpacks:20"

[env]
  PORT = "8000"

[http]
  port = 8000
  handlers = ["http"]

[[services]]
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "5s"
    restart_limit = 5
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify_hostname = false
    tls_skip_verify_certificates = false

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"

